<text x="10.5" y="64.5" text-anchor="middle" font-size="1.3">21 mm × 61 mm envelope</text></g><circle cx="396" cy="148" r="19" fill="#ce9742"/><text x="396" y="155" text-anchor="middle" font-size="21" font-weight="bold">1</text><text x="432" y="154" class="body" font-weight="bold">Regulator + inductor + capacitors</text><text x="432" y="185" class="small">U12 / L1 / C37–C39 / R40–R41</text><text x="432" y="212" class="small">Short switching loops; divider on the quiet side.</text><circle cx="396" cy="270" r="19" fill="#ba7462"/><text x="396" y="277" text-anchor="middle" font-size="21" font-weight="bold">2</text><text x="432" y="276" class="body" font-weight="bold">Charger + local capacitors</text><text x="432" y="307" class="small">U11 / C34–C36 / charge-enable parts</text><text x="432" y="334" class="small">Keep IN, SYS and BAT paths local.</text><circle cx="396" cy="392" r="19" fill="#7785ba"/><text x="396" y="399" text-anchor="middle" font-size="21" font-weight="bold">3</text><text x="432" y="398" class="body" font-weight="bold">USB entry and input-current control</text><text x="432" y="429" class="small">U13–U17 / associated passives</text><text x="432" y="456" class="small">ESD at the contacts; current-limit parts together.</text><circle cx="396" cy="514" r="19" fill="#75a46d"/><text x="396" y="521" text-anchor="middle" font-size="21" font-weight="bold">4</text><text x="432" y="520" class="body" font-weight="bold">Local MCU and haptic driver</text><text x="432" y="551" class="small">U18 below cutout; U3 beside the LRA tail</text><text x="432" y="578" class="small">Use the satellite grouping as a starting point.</text><circle cx="396" cy="636" r="19" fill="#b68cba"/><text x="396" y="643" text-anchor="middle" font-size="21" font-weight="bold">5</text><text x="432" y="642" class="body" font-weight="bold">ESP support and pod power switch</text><text x="432" y="673" class="small">Decoupling / U26 / slew and discharge parts</text><text x="432" y="700" class="small">Finish placement after the larger groups fit.</text><path d="M380 790 H422" stroke="#76d4e8" stroke-width="5" stroke-dasharray="9 6"/>
<text x="432" y="796" class="body">Reserve a USB corridor before filling gaps</text>
<text x="432" y="826" class="small">Keep BOOT/RESET access clear; wake/ship and RGB stay accessible.</text>
<text x="380" y="886" class="small">Blocks are not fitted courtyards or a routing feasibility check.</text>
<text x="380" y="916" class="small">Next: place each group with its actual footprints and check spacing.</text></svg>